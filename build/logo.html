<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hydra Emulator artwork</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { display: grid; width: 100vw; height: 100vh; place-items: center; }
  .stage { display: none; position: relative; overflow: hidden; }
  .layout-square .square-stage { display: grid; width: 1024px; height: 1024px; place-items: center; }
  .tile {
    position: relative; width: 896px; height: 896px; border-radius: 198px;
    background: radial-gradient(ellipse at 50% 8%, #163d35, #0c211e 58%, #081410);
    box-shadow: inset 0 0 0 9px #235346, inset 0 -24px 70px #07130f;
  }
  .mark { position: absolute; inset: 19% 15%; filter: drop-shadow(0 14px 24px #060f0d); }
  .mark::before, .mark::after, .crest {
    position: absolute; inset: 0; content: "";
    background: linear-gradient(160deg, #c5ffe8 3%, #57edb3 44%, #16ac79 100%);
  }
  .mark::before {
    clip-path: polygon(0% 21%, 14% 24%, 25% 35%, 25% 52%, 42% 66%, 42% 100%, 29% 91%, 29% 73%, 12% 56%, 12% 39%, 3% 42%);
  }
  .mark::after {
    transform: scaleX(-1);
    clip-path: polygon(0% 21%, 14% 24%, 25% 35%, 25% 52%, 42% 66%, 42% 100%, 29% 91%, 29% 73%, 12% 56%, 12% 39%, 3% 42%);
  }
  .crest {
    clip-path: polygon(50% 0%, 65% 16%, 57% 32%, 57% 52%, 50% 61%, 43% 52%, 43% 32%, 35% 16%);
  }
  .layout-wide .wide-stage, .layout-splash .splash-stage {
    display: flex; align-items: center; justify-content: center;
    color: #e7fff5; font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(ellipse at 30% 8%, #1b473b, #0c211e 72%);
  }
  .wide-stage { width: 620px; height: 300px; gap: 28px; }
  .splash-stage { width: 1240px; height: 600px; flex-direction: column; gap: 42px; }
  .scaled-tile { position: relative; flex: none; }
  .scaled-tile > .tile { position: absolute; inset: 0 auto auto 0; transform-origin: top left; }
  .wide-stage .scaled-tile { width: 142px; height: 142px; }
  .wide-stage .tile { transform: scale(.158482); }
  .splash-stage .scaled-tile { width: 250px; height: 250px; }
  .splash-stage .tile { transform: scale(.279018); }
  .name { font-weight: 700; font-size: 38px; letter-spacing: -.025em; }
  .splash-stage .name { font-size: 70px; }
  .subtitle { color: #9ac8ba; font-size: 19px; margin-top: 10px; }
</style>
</head>
<body class="layout-square">
  <div class="stage square-stage">
    <div class="tile" id="brand-tile">
      <div class="mark"><div class="crest"></div></div>
    </div>
  </div>
  <div class="stage wide-stage">
    <div class="scaled-tile"></div>
    <div>
      <div class="name">Hydra Emulator</div>
      <div class="subtitle">Android apps on Windows</div>
    </div>
  </div>
  <div class="stage splash-stage">
    <div class="scaled-tile"></div>
    <div class="name">Hydra Emulator</div>
  </div>
<script>
  const tile = document.getElementById('brand-tile');
  document.querySelectorAll('.scaled-tile').forEach((host) => {
    const copy = tile.cloneNode(true);
    copy.removeAttribute('id');
    host.appendChild(copy);
  });
</script>
</body>
</html>
